[package]
name = "stagecraft-hlr"
description = "Hidden-line removal, feature edges and section cuts for StageCraft vector views"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

# No StageCraft dependencies; builds for wasm32-unknown-unknown without features.
[features]
default = []
# Run HLR queries and per-mesh preparation on rayon's thread pool. Leave off for wasm.
parallel = ["dep:rayon"]

[dependencies]
glam.workspace = true
earcutr.workspace = true
rayon = { workspace = true, optional = true }
