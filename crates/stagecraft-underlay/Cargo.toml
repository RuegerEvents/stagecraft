[package]
name = "stagecraft-underlay"
description = "StageCraft underlays: images, PDF pages and SVGs to rasters, DXF and DWG to plain linework. Pure Rust."
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
publish = false

# Builds for wasm32-unknown-unknown: no files, no processes, fonts embedded.
[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
resvg = { version = "0.50", default-features = false, features = ["text", "raster-images"] }
hayro = "0.9"
craft-dxf.workspace = true

# DWG goes through acadrust (MPL-2.0) behind craft-dwg; native only.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
craft-dwg.workspace = true
