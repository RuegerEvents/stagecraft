[package]
name = "stagecraft-core"
description = "Document model and command engine of StageCraft. No UI, no sockets."
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
glam.workspace = true
stagecraft-gdtf.workspace = true
stagecraft-mvr.workspace = true
stagecraft-sketch.workspace = true
stagecraft-underlay.workspace = true
sha2.workspace = true
imbl.workspace = true
schemars = { workspace = true, features = ["uuid1"] }
serde.workspace = true
serde_json = { workspace = true, features = ["float_roundtrip"] }
thiserror.workspace = true
uuid.workspace = true
zip.workspace = true

[dev-dependencies]
tempfile.workspace = true
zip.workspace = true
glam.workspace = true
image.workspace = true

# The browser build needs a JS source of randomness for uuid v4.
[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
uuid = { workspace = true, features = ["js"] }
