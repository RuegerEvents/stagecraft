[package]
name = "stagecraft-mvr"
version = "0.1.0"
edition = "2024"
authors = ["Hannes Rüger <hannes@rueger.events>"]
license = "MIT"
description = "MVR (My Virtual Rig, DIN SPEC 15801) import and export for StageCraft"

# Built standalone while it is developed in parallel with the workspace
# (the root Cargo.toml excludes this crate). Versions match the workspace.
[workspace]

[dependencies]
quick-xml = "0.42"
thiserror = "2"
uuid = { version = "1", features = ["v5"] }
zip = { version = "9", default-features = false, features = ["deflate"] }

