[package]
name = "stagecraft-mvr"
description = "MVR (My Virtual Rig, DIN SPEC 15801) import and export for StageCraft"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

# No StageCraft dependencies (GDTFs are carried as bytes); builds for wasm32-unknown-unknown.
[dependencies]
craft-xml.workspace = true
thiserror.workspace = true
uuid = { workspace = true, features = ["v5"] }
zip.workspace = true
craft-zip.workspace = true

[dev-dependencies]
craft-zip = { workspace = true, features = ["test-support"] }

# The workspace's uuid has v4 on, which needs a JS randomness source in the browser.
[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
uuid = { workspace = true, features = ["js"] }
