[package]
name = "stagecraft-gdtf"
description = "GDTF fixture types for StageCraft: description.xml, geometry tree, DMX modes and footprints, 3DS/glTF models, plan silhouettes, GDTF Share client."
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
publish = false

# Default features build for wasm32-unknown-unknown: no files, no sockets, no clock.
[features]
default = []
# GDTF Share client (blocking HTTP, disk cache). Native only.
share = ["dep:ureq", "dep:serde", "dep:serde_json", "dep:craft-atomic"]
# Read GDTF Share credentials from the macOS keychain.
keychain = ["share", "dep:security-framework"]

[dependencies]
glam.workspace = true
roxmltree.workspace = true
zip.workspace = true
craft-zip.workspace = true
gltf.workspace = true
ureq = { workspace = true, optional = true }
craft-atomic = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = { workspace = true, optional = true }

[dev-dependencies]
craft-zip = { workspace = true, features = ["test-support"] }
