[workspace]
resolver = "2"
members = [
    "crates/stagecraft-core",
    "crates/stagecraft-gdtf",
    "crates/stagecraft-geom",
    "crates/stagecraft-hlr",
    "crates/stagecraft-mvr",
    "crates/stagecraft-sheet",
    "crates/stagecraft-sketch",
    "crates/stagecraft-underlay",
    "crates/stagecraft-control",
    "crates/stagecraft-ui",
    "crates/stagecraft-app",
]

[workspace.package]
version = "0.2.0"
edition = "2024"
authors = ["Hannes Rüger <hannes@rueger.events>"]
license = "MIT"

[workspace.dependencies]
stagecraft-core = { path = "crates/stagecraft-core" }
stagecraft-control = { path = "crates/stagecraft-control" }
stagecraft-gdtf = { path = "crates/stagecraft-gdtf" }
stagecraft-geom = { path = "crates/stagecraft-geom" }
stagecraft-sheet = { path = "crates/stagecraft-sheet" }
stagecraft-hlr = { path = "crates/stagecraft-hlr" }
stagecraft-mvr = { path = "crates/stagecraft-mvr" }
stagecraft-sketch = { path = "crates/stagecraft-sketch" }
stagecraft-underlay = { path = "crates/stagecraft-underlay" }
stagecraft-ui = { path = "crates/stagecraft-ui" }
anyhow = "1"
ezpz = "0.2.29"
faer = { version = "0.24", default-features = false, features = ["std"] }
earcutr = "0.5"
rayon = "1.11"
egui = "0.37"
eframe = "0.37"
egui-wgpu = "0.37"
bytemuck = { version = "1", features = ["derive"] }
egui_kittest = { version = "0.37", features = ["wgpu", "snapshot"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
clap = { version = "4.6", features = ["derive"] }
dirs = "7"
glam = { version = "0.34", features = ["serde"] }
imbl = { version = "7", features = ["serde"] }
schemars = "1.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
sha2 = "0.10"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
roxmltree = "0.20"
gltf = { version = "1", default-features = false, features = ["utils", "names"] }
ureq = { version = "3", features = ["cookies"] }
security-framework = "3"
zip = { version = "9", default-features = false, features = ["deflate"] }
# storytold/craft-libs (MIT OR Apache-2.0), one revision for every crate.
craft-atomic = { git = "https://github.com/storytold/craft-libs", rev = "e9da0dfb37ab5e35c4c6f35949b36f09b8dcfcf9" }
craft-dwg = { git = "https://github.com/storytold/craft-libs", rev = "e9da0dfb37ab5e35c4c6f35949b36f09b8dcfcf9" }
craft-dxf = { git = "https://github.com/storytold/craft-libs", rev = "e9da0dfb37ab5e35c4c6f35949b36f09b8dcfcf9" }
craft-control = { git = "https://github.com/storytold/craft-libs", rev = "e9da0dfb37ab5e35c4c6f35949b36f09b8dcfcf9" }
craft-dialogs = { git = "https://github.com/storytold/craft-libs", rev = "e9da0dfb37ab5e35c4c6f35949b36f09b8dcfcf9" }
craft-jsonrpc = { git = "https://github.com/storytold/craft-libs", rev = "e9da0dfb37ab5e35c4c6f35949b36f09b8dcfcf9" }
craft-mcp-server = { git = "https://github.com/storytold/craft-libs", rev = "e9da0dfb37ab5e35c4c6f35949b36f09b8dcfcf9" }
craft-mesh = { git = "https://github.com/storytold/craft-libs", rev = "e9da0dfb37ab5e35c4c6f35949b36f09b8dcfcf9" }
craft-xml = { git = "https://github.com/storytold/craft-libs", rev = "e9da0dfb37ab5e35c4c6f35949b36f09b8dcfcf9" }
craft-zip = { git = "https://github.com/storytold/craft-libs", rev = "e9da0dfb37ab5e35c4c6f35949b36f09b8dcfcf9" }
craft-ui = { git = "https://github.com/storytold/craft-libs", rev = "e9da0dfb37ab5e35c4c6f35949b36f09b8dcfcf9" }
craft-behavior = { git = "https://github.com/storytold/craft-libs", rev = "e9da0dfb37ab5e35c4c6f35949b36f09b8dcfcf9" }
craft-host = { git = "https://github.com/storytold/craft-libs", rev = "e9da0dfb37ab5e35c4c6f35949b36f09b8dcfcf9" }
craft-theme = { git = "https://github.com/storytold/craft-libs", rev = "e9da0dfb37ab5e35c4c6f35949b36f09b8dcfcf9" }
craft-settings = { git = "https://github.com/storytold/craft-libs", rev = "e9da0dfb37ab5e35c4c6f35949b36f09b8dcfcf9" }
craft-menu = { git = "https://github.com/storytold/craft-libs", rev = "e9da0dfb37ab5e35c4c6f35949b36f09b8dcfcf9" }
craft-quit = { git = "https://github.com/storytold/craft-libs", rev = "e9da0dfb37ab5e35c4c6f35949b36f09b8dcfcf9", features = ["ui"] }
craft-window = { git = "https://github.com/storytold/craft-libs", rev = "e9da0dfb37ab5e35c4c6f35949b36f09b8dcfcf9", features = ["ui"] }

# storytold's egui fork (0.37 plus the suite's patches) and its winit companion, at the
# revisions craft-libs pins in its own workspace [patch]. A dependency's [patch] is ignored by
# its consumer, so they are repeated here.
[patch.crates-io]
ecolor = { git = "https://github.com/storytold/egui.git", rev = "b9770908e0f304896f9658d239a7b29cf8af1564" }
emath = { git = "https://github.com/storytold/egui.git", rev = "b9770908e0f304896f9658d239a7b29cf8af1564" }
epaint = { git = "https://github.com/storytold/egui.git", rev = "b9770908e0f304896f9658d239a7b29cf8af1564" }
epaint_default_fonts = { git = "https://github.com/storytold/egui.git", rev = "b9770908e0f304896f9658d239a7b29cf8af1564" }
egui = { git = "https://github.com/storytold/egui.git", rev = "b9770908e0f304896f9658d239a7b29cf8af1564" }
egui-winit = { git = "https://github.com/storytold/egui.git", rev = "b9770908e0f304896f9658d239a7b29cf8af1564" }
egui-wgpu = { git = "https://github.com/storytold/egui.git", rev = "b9770908e0f304896f9658d239a7b29cf8af1564" }
egui_kittest = { git = "https://github.com/storytold/egui.git", rev = "b9770908e0f304896f9658d239a7b29cf8af1564" }
eframe = { git = "https://github.com/storytold/egui.git", rev = "b9770908e0f304896f9658d239a7b29cf8af1564" }
winit = { git = "https://github.com/storytold/winit.git", rev = "a517b3846ee8457d84ee4975110bfda6797c44dc" }

# Hidden-line removal runs on every sheet change; keep it fast in debug builds too.
[profile.dev.package.stagecraft-hlr]
opt-level = 2

# The sketch solver: faer's generic dense QR is monomorphised into stagecraft-sketch and
# is ~500x slower unoptimised (6 s instead of 12 ms for a 200-point room analysis).
[profile.dev.package.stagecraft-sketch]
opt-level = 2
[profile.dev.package.faer]
opt-level = 3
[profile.dev.package.ezpz]
opt-level = 3

# Underlay rasterising (SVG, PDF) and PNG decoding: seconds instead of tens of seconds
# unoptimised.
[profile.dev.package.resvg]
opt-level = 3
[profile.dev.package.usvg]
opt-level = 3
[profile.dev.package.tiny-skia]
opt-level = 3
[profile.dev.package.hayro]
opt-level = 3
[profile.dev.package.hayro-interpret]
opt-level = 3
[profile.dev.package.hayro-syntax]
opt-level = 3
[profile.dev.package.vello_cpu]
opt-level = 3
[profile.dev.package.png]
opt-level = 3
[profile.dev.package.zune-jpeg]
opt-level = 3
[profile.dev.package.fdeflate]
opt-level = 3
[profile.dev.package.miniz_oxide]
opt-level = 3
