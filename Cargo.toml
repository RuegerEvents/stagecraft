[workspace]
resolver = "2"
# Developed standalone in parallel; joins the workspace when integrated.
exclude = ["crates/stagecraft-mvr", "crates/stagecraft-hlr", "crates/stagecraft-sketch"]
members = [
    "crates/stagecraft-core",
    "crates/stagecraft-gdtf",
    "crates/stagecraft-geom",
    "crates/stagecraft-sheet",
    "crates/stagecraft-control",
    "crates/stagecraft-ui",
    "crates/stagecraft-app",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Hannes Rüger <hannes@rueger.events>"]
license = "MIT"

[workspace.dependencies]
stagecraft-core = { path = "crates/stagecraft-core" }
stagecraft-control = { path = "crates/stagecraft-control" }
stagecraft-gdtf = { path = "crates/stagecraft-gdtf" }
stagecraft-geom = { path = "crates/stagecraft-geom" }
stagecraft-sheet = { path = "crates/stagecraft-sheet" }
stagecraft-ui = { path = "crates/stagecraft-ui" }
anyhow = "1"
earcutr = "0.5"
egui = "0.36.2"
eframe = "0.36.2"
egui-wgpu = "0.36.2"
bytemuck = { version = "1", features = ["derive"] }
egui_kittest = { version = "0.36.2", features = ["wgpu", "snapshot"] }
image = { version = "0.25", default-features = false, features = ["png"] }
rfd = "0.16"
clap = { version = "4.6", features = ["derive"] }
dirs = "7"
glam = { version = "0.34", features = ["serde"] }
imbl = { version = "7", features = ["serde"] }
schemars = "1.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
sha2 = "0.10"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
roxmltree = "0.20"
gltf = { version = "1", default-features = false, features = ["utils", "names"] }
ureq = { version = "3", features = ["cookies"] }
security-framework = "3"
zip = { version = "9", default-features = false, features = ["deflate"] }
