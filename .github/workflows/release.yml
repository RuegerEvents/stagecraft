name: Release

# Push a tag like v0.2.0: builds macOS (Apple Silicon .dmg), Windows and Linux and
# publishes a GitHub release with them.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create the release
        run: gh release create "$GITHUB_REF_NAME" --title "StageCraft $GITHUB_REF_NAME" --generate-notes --verify-tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  binaries:
    name: ${{ matrix.target }}
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-22.04 }
          - { target: x86_64-pc-windows-msvc, os: windows-latest }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Linux system packages
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libxkbcommon-dev libwayland-dev libgl1-mesa-dev libgtk-3-dev libxdo-dev libssl-dev
      - uses: taiki-e/upload-rust-binary-action@v1
        with:
          bin: stagecraft
          target: ${{ matrix.target }}
          archive: StageCraft-$tag-$target
          include: README.md,THIRD_PARTY.md
          locked: true
          token: ${{ secrets.GITHUB_TOKEN }}

  macos-dmg:
    name: macOS app (Apple Silicon .dmg)
    needs: create-release
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - run: scripts/macos-dmg.sh "$GITHUB_REF_NAME"
      - run: gh release upload "$GITHUB_REF_NAME" dist/*.dmg --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
