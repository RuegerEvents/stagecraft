name: Release

# Push a tag like v0.2.0: builds macOS (Apple Silicon .dmg), Windows and Linux and
# publishes a GitHub release with them.
on:
  push:
    tags: ["v*"]
  # Build the artifacts again for an existing tag (the release is reused).
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build, e.g. v0.2.0"
        required: true
      all:
        description: "Also rebuild the Windows and Linux archives (otherwise only the macOS DMG)"
        type: boolean
        default: false

env:
  TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - name: Create the release (unless it exists)
        run: gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "StageCraft $TAG" --generate-notes --verify-tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  binaries:
    name: ${{ matrix.target }}
    needs: create-release
    if: github.event_name == 'push' || inputs.all
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-22.04 }
          - { target: x86_64-pc-windows-msvc, os: windows-latest }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Linux system packages
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libxkbcommon-dev libwayland-dev libgl1-mesa-dev libgtk-3-dev libxdo-dev libssl-dev
      - uses: taiki-e/upload-rust-binary-action@v1
        with:
          bin: stagecraft
          target: ${{ matrix.target }}
          archive: StageCraft-${{ env.TAG }}-$target
          ref: refs/tags/${{ env.TAG }}
          include: README.md,THIRD_PARTY.md
          locked: true
          token: ${{ secrets.GITHUB_TOKEN }}

  macos-dmg:
    name: macOS app (Apple Silicon .dmg)
    needs: create-release
    runs-on: macos-latest
    steps:
      # The release build fills most of the runner's disk; hdiutil needs room for the image.
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf ~/Library/Android /usr/local/share/dotnet ~/.dotnet /Library/Developer/CoreSimulator /Users/runner/Library/Developer/CoreSimulator || true
          df -h /
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      # The packaging script of the workflow's own commit, so a rebuild of an older tag
      # gets its fixes.
      - uses: actions/checkout@v4
        with:
          path: .packaging
          sparse-checkout: scripts
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - run: STAGECRAFT_ROOT="$PWD" .packaging/scripts/macos-dmg.sh "$TAG"
      - run: gh release upload "$TAG" dist/*.dmg --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
